
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Handleliste</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0879ef">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <script type="module" src="./js/pwa.js"></script>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="header">
        <div class="controls">
          <select id="fontSize" onchange="updateFontSize()">
            <option value="16">Normal</option>
            <option value="20">Large</option>
            <option value="24">Extra Large</option>
            <option value="36">Huge</option>
          </select>
          <select id="personSelector" onchange="updatePerson()">
            <option value="Morten">Morten</option>
            <option value="Linh">Linh</option>
          </select>
          <!-- <button onclick="logout()" style="background-color: white; color: black; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin-left: 10px;">Logout</button> -->
        </div>
        <span id="appVersion" class="app-version" aria-label="Appversjon"></span>
      </div>

      <ul id="itemList" class="item-list"></ul>
      <p id="connectionStatus" class="connection-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
    </div>

    <div class="footer">
      <button id="addButton">Koble til internett</button>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
